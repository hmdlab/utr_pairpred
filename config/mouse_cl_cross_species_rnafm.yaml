# General params - Cross-species training configuration
# This config trains on ALL mouse data (no train/val/test split)
wandb_project: UTR_PairPred
wandb_group: cross_species
wandb_mode: disabled
multi_species: False
cross_species: True  # Use all data for training (no split)
result_dir: ../results/runs/cross_species_mouse_cl_rnafm
data_dir: ../data
seq_data: ../data/mouse/gencode_vM33_utr_gene_unique_cdhit09.csv # path to raw data csv
emb_type: rnafm  # embedding type: 'rinalmo' or 'rnafm'
emb_data: ../data/mouse/gencode_vM33_embedding_ave_cdhit09.pkl # Using RNAFM embedding
conduct_test: False  # No test during training for cross-species
seed: 0
gpus: [0,1,2,3]
kfold: 1  # No cross-validation for cross-species training

# Params related to training
train:
  train_bs: 32 #Training batch size
  val_bs: 32 #Validation batch size
  lr: 1e-4 #Learning rate
  epoch: 60 # Training epoch
  val_epoch: 5 #Validate in each this epoch
  grad_acc: 1 #Gradient_accumulations steps


# Params related to model arch
model:
  arch: contrastive
  input_dim: 640 # When RNAFM emb, input_dim must be 640. When RiNALMo emb, input_dim must be 1280
  output_dim: 512
  dropout1: 0.8
  dropout2: 0.5
